<!DOCTYPE html>
<html>

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FNCRC8RCC1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-FNCRC8RCC1');
  </script>
  <title>FileScope</title>
  <link rel="stylesheet" href="/templates/styles.css">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%236366f1;stop-opacity:1' /><stop offset='100%' style='stop-color:%23818cf8;stop-opacity:1' /></linearGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23grad)'/><text x='50' y='65' font-family='Inter, sans-serif' font-size='40' font-weight='900' text-anchor='middle' fill='white'>F</text></svg>">
</head>

<body>

  <div class="container">
    <span class="logo">F</span>
    <h1 class="title">FileScope</h1>
    <h3>Identify Contributors to Your Files</h3>
    <!-- Update the description below the title to mention public repos only -->
    <p class="subtitle" style="text-align:center; color:#6366f1; margin-bottom: 1.5rem; font-weight: 500;">Note: This
      tool only works for <b>public</b> GitHub repositories.</p>

    <form id="pr-form" method="post" action="/getPR">
      <div class="input-group">
        <input type="url" name="filePath" id="filePath" placeholder="Paste full GitHub file URL..." required>
      </div>
      <button type="submit" class="submit-button">Find PRs</button>
    </form>

    <div id="error-message" class="message error"></div>
    <div id="success-message" class="message success"></div>
    <div id="loading-overlay">
      <div class="loader-box">
        <div class="spinner"></div>
        <div class="loading-text">Fetching PRs, please wait...</div>
      </div>
    </div>

    <div id="pr-tabs" style="display:none;">
      <div class="tabs">
        <button id="open-tab" class="tab active">Open PRs (<span id="open-count">0</span>)</button>
        <button id="closed-tab" class="tab">Closed PRs (<span id="closed-count">0</span>)</button>
      </div>
      <div class="table-container">
        <table id="open-table" class="pr-table">
          <thead>
            <tr>
              <th>PR #</th>
              <th>Created On</th>
              <th>Creator</th>
              <th>Title</th>
              <th>Branch</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <table id="closed-table" class="pr-table" style="display:none;">
          <thead>
            <tr>
              <th>PR #</th>
              <th>Created On</th>
              <th>Creator</th>
              <th>Title</th>
              <th>Branch</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-36J1SLZ1FL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-36J1SLZ1FL');
  </script>

  <script>
    const form = document.getElementById("pr-form");
    const errorMessage = document.getElementById("error-message");
    const successMessage = document.getElementById("success-message");
    const loadingOverlay = document.getElementById("loading-overlay");
    const prTabs = document.getElementById("pr-tabs");
    const openTabBtn = document.getElementById("open-tab");
    const closedTabBtn = document.getElementById("closed-tab");
    const openTable = document.getElementById("open-table");
    const closedTable = document.getElementById("closed-table");
    const openCount = document.getElementById("open-count");
    const closedCount = document.getElementById("closed-count");
    const openTbody = openTable.querySelector("tbody");
    const closedTbody = closedTable.querySelector("tbody");

    function setActiveTab(tab) {
      if (tab === "open") {
        openTabBtn.classList.add("active");
        closedTabBtn.classList.remove("active");
        openTable.style.display = "table";
        closedTable.style.display = "none";
      } else {
        openTabBtn.classList.remove("active");
        closedTabBtn.classList.add("active");
        openTable.style.display = "none";
        closedTable.style.display = "table";
      }
    }
    openTabBtn.onclick = () => setActiveTab("open");
    closedTabBtn.onclick = () => setActiveTab("closed");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorMessage.style.display = "none";
      successMessage.style.display = "none";
      prTabs.style.display = "none";
      loadingOverlay.classList.add("active");
      openTbody.innerHTML = "";
      closedTbody.innerHTML = "";

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: formData,
        });
        loadingOverlay.classList.remove("active");
        if (!response.ok) {
          const err = await response.json();
          errorMessage.textContent = err.msg || "Something went wrong.";
          errorMessage.style.display = "block";
          errorMessage.style.color = "#dc2626"; // force red color
          errorMessage.style.textAlign = "center"; // center the error message
          errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        const prs = await response.json();
        if (!prs.prs || prs.prs.length === 0) {
          errorMessage.textContent = "No PRs found modifying the file.";
          errorMessage.style.display = "block";
          errorMessage.style.color = "#dc2626"; // force red color
          errorMessage.style.textAlign = "center"; // center the error message
          errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        // Split PRs into open and closed
        const openPRs = prs.prs.filter(pr => pr.state && pr.state.toLowerCase() === "open");
        const closedPRs = prs.prs.filter(pr => pr.state && pr.state.toLowerCase() === "closed");
        openCount.textContent = openPRs.length;
        closedCount.textContent = closedPRs.length;
        populateTable(openTbody, openPRs);
        populateTable(closedTbody, closedPRs);
        prTabs.style.display = "block";
        setActiveTab("open");
        successMessage.textContent = `Found ${prs.prs.length} PR(s).`;
        successMessage.style.display = "block";
      } catch (e) {
        loadingOverlay.classList.remove("active");
        errorMessage.textContent = e.message || "Network error.";
        errorMessage.style.display = "block";
        errorMessage.style.color = "#dc2626"; // force red color
        errorMessage.style.textAlign = "center"; // center the error message
        errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    function populateTable(tbody, prArr) {
      tbody.innerHTML = "";
      // Remove any previous no-prs-message
      const oldMsg = document.querySelector('.no-prs-message');
      if (oldMsg) oldMsg.remove();
      if (prArr.length === 0) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'no-prs-message';
        msgDiv.textContent = 'No PRs found.';
        tbody.parentElement.parentElement.appendChild(msgDiv);
        return;
      }
      prArr.forEach(pr => {
        const row = document.createElement("tr");
        row.innerHTML = `
      <td><a href="${pr.html_url}" target="_bla" reener noreferrer">${pr.number}</a></td>
      <td>${pr.created_at.fullDate}</td>
      <td>${pr.created_by}</td>
      <td>${pr.title}</td>
      <td>${pr.branch}</td>
    `;
        tbody.appendChild(row);
      });
    }
  </script>

</body>

</html>
